[project]
name = "strata"
version = "0.2.0"
description = "Three-pass security-fix discovery: triage, adjudication, security-context compilation"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "openai>=2.48.0",
    "tiktoken>=0.13.0",
    "tree-sitter-language-pack>=1.13.3",
]

[project.optional-dependencies]
codex = [
    "openai-codex>=0.144.4",
]

[project.scripts]
strata = "strata.__main__:main"
strata-eval = "strata_eval.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata", "src/strata_eval"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "advisory-database",
    "ghsa-commits",
    "legacy",
    ".git",
    ".venv",
]

[tool.ruff]
line-length = 96
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]
