[project]
name = "strata"
version = "0.1.0"
description = "Sample and summarize GitHub Security Advisories"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
norecursedirs = [
    "advisory-database",
    "ghsa-commits",
    ".git",
    ".venv",
]
